<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アイカツ！アンコール">
<title>アイカツ！アンコール カード管理</title>
<style>
:root{--bg:#f7f5fb;--panel:#fff;--ink:#403c4b;--muted:#8b8697;--line:#e9e4ef;--pink:#df9fbd;--blue:#a9cde3;--shadow:0 8px 24px #665c7418}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
button,input,select{font:inherit}.app{min-height:100vh;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));max-width:1100px;margin:auto}
header{padding:20px 4px 8px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:5;background:#f7f5fbf2;padding:10px 0;backdrop-filter:blur(12px)}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;outline:none;box-shadow:var(--shadow)}
.filters{display:flex;gap:7px;overflow:auto;padding:9px 0 2px}select,.actions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;white-space:nowrap;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.actions{display:flex;gap:7px;margin-bottom:12px}.actions button{flex:1;box-shadow:var(--shadow)}.actions .primary{background:linear-gradient(135deg,#eeb7cf,#b8d8e8);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}.card.owned{outline:3px solid #dca8c3}
.pic{aspect-ratio:.72;background:#eeeaf2;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pic .fallback{font-size:11px;color:var(--muted);text-align:center;padding:8px}
.info{padding:7px 8px 9px}.name{font-size:11px;font-weight:700}.meta{font-size:9px;color:var(--muted);margin-top:3px}.check{position:absolute;right:6px;top:6px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#ffffffdf;border:1px solid var(--line);font-size:15px}.owned .check{background:var(--pink);color:#fff;border-color:var(--pink)}
.empty{text-align:center;padding:50px 15px;color:var(--muted)}
.note{margin:18px 2px;color:var(--muted);font-size:11px;line-height:1.6}
@media(max-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.stats{grid-template-columns:repeat(2,1fr)}.app{padding-left:9px;padding-right:9px}.info{padding:6px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🎀 アイカツ！アンコール</h1><div class="sub">1弾・カードコレクションブック（全85枚）</div></header>
<div class="toolbar">
<input id="search" class="search" placeholder="🔍 カード番号で検索（E1-01など）">
<div class="filters">
<select id="rarity"><option value="">レア度：すべて</option><option value="PR">PR</option><option value="ER">ER</option><option value="R">R</option><option value="N">N</option></select>
<select id="owned"><option value="">表示：すべて</option><option value="1">所持のみ</option><option value="0">未所持のみ</option></select>
<select id="series"><option value="">弾数：すべて</option><option value="1弾">1弾</option></select>
</div></div>
<div class="stats">
<div class="stat"><b id="total">85</b><span>登録カード</span></div>
<div class="stat"><b id="have">0</b><span>所持カード</span></div>
<div class="stat"><b id="miss">85</b><span>未所持</span></div>
<div class="stat"><b id="rate">0%</b><span>コンプリート率</span></div>
</div>
<div class="actions">
<button class="primary" onclick="document.getElementById('allImageInput').click()">📷 写真を追加</button>
<button onclick="exportData()">💾 バックアップ</button>
<button onclick="document.getElementById('importFile').click()">↩ 復元</button>
<input id="allImageInput" type="file" accept="image/*" multiple hidden>
<input id="importFile" type="file" accept=".json" hidden>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">条件に一致するカードがありません。</div>
<div class="note">
公式カードリストで確認できる1弾の通常カード85枚をカード番号順で登録しています。画像は公式カードリストを表示しています。<br>
写真を追加すると、選択した写真をカード画像として登録できます。所持状態はこの端末のブラウザに保存されます。
</div>
</div>

const KEY="aikatsuEncoreCollectionV2";
let state={owned:{}, customImages:{}};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toggle(code){state.owned[code]=!state.owned[code];save();render()}
function render(){
 const q=$("search").value.trim().toUpperCase(), r=$("rarity").value, o=$("owned").value, s=$("series").value;
 const list=cards.filter(c=>(!q||c.code.includes(q))&&(!r||c.rarity===r)&&(!o||(o==="1"?state.owned[c.code]:!state.owned[c.code]))&&(!s||c.series===s));
 $("grid").innerHTML=list.map(c=>{
   const img=state.customImages[c.code]||c.img;
   return `<div class="card ${state.owned[c.code]?"owned":""}" onclick="toggle('${c.code}')" title="タップで所持/未所持">
   <div class="check">${state.owned[c.code]?"✓":"＋"}</div>
   <div class="pic"><img src="${img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback" style="display:none">画像を読み込めません<br>${c.code}</div></div>
   <div class="info"><div class="name">${c.code}</div><div class="meta">${c.rarity} ・ 1弾</div></div></div>`
 }).join("");
 $("empty").style.display=list.length?"none":"block";
 const total=cards.length, have=cards.filter(c=>state.owned[c.code]).length;
 $("total").textContent=total;$("have").textContent=have;$("miss").textContent=total-have;$("rate").textContent=Math.round(have/total*100)+"%";
}
["search","rarity","owned","series"].forEach(id=>$(id).addEventListener("input",render));
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aikatsu-encore-backup.json";a.click();URL.revokeObjectURL(a.href)
}
$("importFile").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state={...state,...JSON.parse(r.result)};save();render()}catch{alert("バックアップを読み込めませんでした")}};r.readAsText(f)
});
$("allImageInput").addEventListener("change",async e=>{
 const files=[...e.target.files];
 if(!files.length)return;
 alert("写真をカードに割り当てます。選択した順に E1-01 から順番に登録します。85枚を一度に選んだ場合は85枚すべて入ります。");
 const targets=cards.slice(0,files.length);
 for(let i=0;i<targets.length;i++) state.customImages[targets[i].code]=await readData(files[i]);
 save();render();e.target.value="";
});
function readData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
render();
</script>
</body>
</html>
